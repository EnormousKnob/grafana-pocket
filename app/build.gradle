plugins { id 'com.android.application' }

layout.buildDirectory = rootProject.layout.projectDirectory.dir('.build-1.6.0/app')

android {
    namespace 'com.example.grafanapocket'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.grafanapocket'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '1.6.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
